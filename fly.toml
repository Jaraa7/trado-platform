app = "trado-bot"
primary_region = "sin"  # Singapore — أقرب لمنطقة الخليج

[processes]
  app   = "uvicorn main:app --host 0.0.0.0 --port 8000"
  brain = "python -m nervous.scheduler"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "8000"

[http_service]
  processes = ["app"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# ملاحظة: أُزيلت كتلة [[services]] لأنها كانت تتعارض مع [http_service] أعلاه
# (خدمتان على نفس المنفذ 8000 تسببان تعارض 80/443 عند النشر)
