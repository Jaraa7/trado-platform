# fly.toml app configuration file generated for trado-platform on 2026-11-06T22:30:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trado-platform'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  PORT = '8000'

[processes]
  app = 'uvicorn main:app --host 0.0.0.0 --port 8000'
  brain = 'python -m nervous.scheduler'
  t100 = 'python -m trado100.worker'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
